<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgPenguins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <linearGradient id="neonPenguinsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1000" height="250" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-8px, 6px); opacity: 0.6; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes floatCluster1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatCluster2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes floatCluster3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .orb-violet { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 150px 80px; }
    .orb-cyan { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 850px 150px; }
    .shimmer-line { animation: shimmerMove 4s linear infinite; }

    .cluster-adelie { animation: floatCluster1 2.2s ease-in-out infinite; }
    .cluster-chinstrap { animation: floatCluster2 2.8s ease-in-out infinite 0.4s; }
    .cluster-gentoo { animation: floatCluster3 2.5s ease-in-out infinite 0.8s; }

    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 400; }
    .mono-text { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1000" height="250" fill="url(#bgPenguins)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="70" r="140" fill="#7000FF" opacity="0.22" class="orb-violet" filter="url(#neonGlow)" />
    <circle cx="850" cy="140" r="160" fill="#00F0FF" opacity="0.18" class="orb-cyan" filter="url(#neonGlow)" />
    <circle cx="500" cy="30" r="100" fill="#FF007F" opacity="0.12" class="orb-violet" filter="url(#neonGlow)" />

    <!-- Technical Grid Pattern -->
    <g opacity="0.06" stroke="#00F0FF" stroke-width="1">
      <line x1="0" y1="50" x2="1000" y2="50" />
      <line x1="0" y1="100" x2="1000" y2="100" />
      <line x1="0" y1="150" x2="1000" y2="150" />
      <line x1="0" y1="200" x2="1000" y2="200" />
      <line x1="100" y1="0" x2="100" y2="250" />
      <line x1="250" y1="0" x2="250" y2="250" />
      <line x1="400" y1="0" x2="400" y2="250" />
      <line x1="550" y1="0" x2="550" y2="250" />
      <line x1="700" y1="0" x2="700" y2="250" />
      <line x1="850" y1="0" x2="850" y2="250" />
    </g>

    <!-- Animated Multivariate Scatter / Clusters on Right -->
    <g opacity="0.85" transform="translate(730, 25)">
      <!-- Coordinate Plane Axes -->
      <line x1="30" y1="160" x2="240" y2="160" stroke="#94A3B8" stroke-width="1.2" opacity="0.4" />
      <line x1="30" y1="20" x2="30" y2="160" stroke="#94A3B8" stroke-width="1.2" opacity="0.4" />

      <!-- Cluster 1: Adelie (Orange/Gold) -->
      <g class="cluster-adelie" filter="url(#softGlow)">
        <ellipse cx="75" cy="120" rx="30" ry="20" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
        <circle cx="65" cy="115" r="4.5" fill="#FFD700" />
        <circle cx="80" cy="125" r="4" fill="#FFD700" />
        <circle cx="70" cy="130" r="3.5" fill="#FFD700" />
        <circle cx="85" cy="110" r="4.5" fill="#FFD700" />
      </g>

      <!-- Cluster 2: Chinstrap (Cyan) -->
      <g class="cluster-chinstrap" filter="url(#softGlow)">
        <ellipse cx="130" cy="80" rx="28" ry="22" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
        <circle cx="120" cy="75" r="4.5" fill="#00F0FF" />
        <circle cx="135" cy="85" r="4" fill="#00F0FF" />
        <circle cx="140" cy="70" r="3.5" fill="#00F0FF" />
        <circle cx="125" cy="90" r="4.5" fill="#00F0FF" />
      </g>

      <!-- Cluster 3: Gentoo (Magenta/Violet) -->
      <g class="cluster-gentoo" filter="url(#softGlow)">
        <ellipse cx="190" cy="50" rx="32" ry="24" fill="none" stroke="#FF007F" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
        <circle cx="180" cy="45" r="5" fill="#FF007F" />
        <circle cx="195" cy="55" r="4.5" fill="#FF007F" />
        <circle cx="205" cy="40" r="4" fill="#FF007F" />
        <circle cx="185" cy="60" r="4" fill="#FF007F" />
      </g>
    </g>

    <!-- Top Glow Accent Line with Shimmer -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#neonPenguinsGrad)" />
    <rect x="0" y="0" width="250" height="3" fill="url(#shimmerGrad)" class="shimmer-line" />

    <!-- Top Badge / Header Tag -->
    <g transform="translate(60, 36)">
      <rect x="0" y="0" width="340" height="26" rx="13" fill="#1b1236" stroke="#7000FF" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="13" cy="13" r="4.5" fill="#00F0FF" filter="url(#softGlow)" />
      <text x="26" y="17" fill="#E2E8F0" font-size="11" class="title-text" letter-spacing="1">
        MULTIVARIATE STATISTICS &amp; ML
      </text>
    </g>

    <!-- Main Title: PALMER PENGUINS EDA -->
    <g transform="translate(60, 108)">
      <!-- Data / Bar Chart Icon -->
      <g transform="translate(0, -32) scale(0.95)">
        <path d="M4 28 L4 4 M12 28 L12 12 M20 28 L20 18 M28 28 L28 8" 
              fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      </g>
      
      <text x="50" y="5" fill="#FFFFFF" font-size="40" class="title-text" letter-spacing="1.5">
        PALMER PENGUINS
      </text>
      <text x="495" y="5" fill="#7000FF" font-size="40" class="title-text" letter-spacing="1.5" filter="url(#softGlow)">
        EDA &amp; ML
      </text>
    </g>

    <!-- Subtitle -->
    <text x="60" y="148" fill="#94A3B8" font-size="15" class="body-text" letter-spacing="0.5">
      Análise Estatística Multivariada, Testes de Hipóteses &amp; Benchmark de 8 Modelos de Classificação
    </text>

    <!-- Bottom Status Badges Row -->
    <g transform="translate(60, 180)">
      <rect x="0" y="0" width="700" height="34" rx="8" fill="#0b1224" stroke="#1c2b4e" stroke-width="1" opacity="0.9" />
      
      <!-- Feature Pills -->
      <g transform="translate(20, 21)">
        <circle cx="0" cy="-3" r="4" fill="#00F0FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Python 3.x</text>
      </g>
      
      <g transform="translate(135, 21)">
        <circle cx="0" cy="-3" r="4" fill="#7000FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Pandas &amp; Seaborn</text>
      </g>

      <g transform="translate(300, 21)">
        <circle cx="0" cy="-3" r="4" fill="#FF007F" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">SciPy Statistics</text>
      </g>

      <g transform="translate(470, 21)">
        <circle cx="0" cy="-3" r="4" fill="#10B981" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">8 Classifiers (98.5%–100% Acc)</text>
      </g>
    </g>

    <!-- Subtle Border Around Banner -->
    <rect x="0" y="0" width="1000" height="250" rx="14" fill="none" stroke="#7000FF" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
